version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: campussync_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campussync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campussync_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-campussync_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campussync -d campussync_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: campussync_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-campussync}:${POSTGRES_PASSWORD:-campussync_secret_2026}@db:5432/${POSTGRES_DB:-campussync_db}
      JWT_SECRET: ${JWT_SECRET:-campussync_super_secret_jwt_key_2026_ddugu_hackathon}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      BACKEND_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: campussync_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: on-failure

volumes:
  pgdata:

